name: Issue Labeling

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const labels = [];

            // Label based on issue template type
            if (body.includes('bug report') || title.includes('[bug]')) {
              labels.push('bug');
            }
            if (body.includes('user story') || title.includes('[story]')) {
              labels.push('story');
            }
            if (body.includes('[task]') || title.includes('[task]')) {
              labels.push('task');
            }
            if (body.includes('[devops]') || title.includes('[devops]')) {
              labels.push('devops');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
