name: Issue Labeling

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by Title
        uses: actions/labeler@v4
        with:
          configuration-path: .github/labeler.yml
```

